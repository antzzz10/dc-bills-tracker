name: Monitor DC Bills

# Watchdog-dispatched recoveries get a distinct run name: the freshness watchdog
# identifies its own past recovery attempts by displayTitle + event, which is what
# bounds it to one automatic dispatch per stale episode. On schedule events `inputs`
# is empty, so the expression falls through to the plain name. Design record:
# docs/watchdog-self-heal-proposal.md.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_source == 'watchdog'
      && 'Monitor DC Bills (watchdog recovery)'
      || 'Monitor DC Bills' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: skip committing/pushing bill updates and skip the site deploy (still runs the real monitor check and sends the real email)'
        type: boolean
        default: false
      recovery_source:
        description: 'What triggered this dispatch (the freshness watchdog sets "watchdog")'
        type: string
        default: manual
  schedule:
    - cron: '0 14 * * *'

# false: a newly dispatched run — including the watchdog's recovery — queues behind an
# in-progress run instead of cancelling it. The stuck-queued case this used to paper
# over (2026-07-25: 4h39m in `queued`) is now handled explicitly by the freshness
# watchdog, which cancels a monitor run queued past its threshold before re-dispatching.
concurrency:
  group: monitor-bills
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # A healthy run takes ~2-3 minutes. Fail loudly rather than hanging.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run bill monitoring script
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: node scripts/monitor-bills.js > monitoring-report.txt

      # Data-quality gate: if the updated bills.json fails consistency checks or
      # drifts from golden labels, fail here so nothing is committed or deployed.
      - name: Lint bill data (consistency + golden-label eval)
        run: node scripts/lint-bills.js

      - name: Regenerate stats for the claims check
        run: node scripts/generate-stats.js

      # Claims gate: lint-bills.js validates the data's shape; this renders the sentences
      # the page will actually show and asserts each against bills.json. Every falsehood
      # this site has published came from well-formed data, so shape alone is not enough.
      - name: Check published claims (banner + summary)
        run: node scripts/check-published-claims.js

      - name: Check for unvalidated bills
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync } from 'fs';
          const data = JSON.parse(readFileSync('src/data/bills.json', 'utf-8'));
          // Only the sections this job actually fetches. It used to count riders and
          // supportBills too, which the monitor never scans — 17 of 18 riders are
          // provisions of one appropriations bill and support bills are parked — so the
          // warning reported 102 unvalidated entries every single run and meant nothing.
          const scanned = data.bills || [];
          const unvalidated = scanned.filter(b => !b.congressValidated);
          if (unvalidated.length > 0) {
            console.log(`⚠️  WARNING: ${unvalidated.length} of ${scanned.length} scanned bill(s) have never been confirmed on Congress.gov:`);
            unvalidated.forEach(b => console.log(`  - ${b.id} (${(b.billNumbers||[]).join(', ')})`));
            console.log('These should self-resolve on the next successful run; a bill that persists here may have a wrong number.');
          } else {
            console.log(`✅ All ${scanned.length} scanned bills confirmed on Congress.gov.`);
          }
          EOF

      - name: Check for changes
        id: check_changes
        run: |
          if [ -f bill-status-history.json ]; then
            # Prefer this run's own timestamp. A run where every lookup failed is no longer
            # appended to the history, so .[-1] there belongs to an earlier run and would
            # mislabel the artifact and email.
            if [ -f monitoring-meta.json ]; then
              LATEST=$(jq -r '.timestamp' monitoring-meta.json)
            else
              LATEST=$(jq -r '.[-1].timestamp' bill-status-history.json)
            fi
            CHANGES_COUNT=$(cat bill-status-history.json | jq -r '.[-1].changes | length')
            SAFE_TIMESTAMP=$(echo $LATEST | tr ':' '-')
            echo "timestamp=$LATEST" >> $GITHUB_OUTPUT
            echo "safe_timestamp=$SAFE_TIMESTAMP" >> $GITHUB_OUTPUT
            echo "changes_count=$CHANGES_COUNT" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Read summary meta
        id: summary_meta
        run: |
          if [ -f monitoring-meta.json ]; then
            HAS_MEANINGFUL=$(jq -r '.hasMeaningfulChanges' monitoring-meta.json)
            PASSED_COUNT=$(jq -r '.passedCount' monitoring-meta.json)
            ERROR_COUNT=$(jq -r '.errorCount' monitoring-meta.json)
            TOTAL_BILLS=$(jq -r '.totalBills' monitoring-meta.json)
            CHECK_FAILED=$(jq -r '.checkFailed' monitoring-meta.json)
            echo "has_meaningful_changes=$HAS_MEANINGFUL" >> $GITHUB_OUTPUT
            echo "passed_count=$PASSED_COUNT" >> $GITHUB_OUTPUT
            echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
            echo "total_bills=$TOTAL_BILLS" >> $GITHUB_OUTPUT
            echo "check_failed=$CHECK_FAILED" >> $GITHUB_OUTPUT
          else
            # No meta file means the monitor script died before writing one. Treat that
            # as a failed check rather than a quiet no-op.
            echo "has_meaningful_changes=false" >> $GITHUB_OUTPUT
            echo "check_failed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload monitoring report
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report-${{ steps.check_changes.outputs.safe_timestamp }}
          path: |
            monitoring-report.txt
            monitoring-summary.html
            monitoring-meta.json
            bill-status-history.json
          retention-days: 90

      - name: Commit and push updates
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true' && steps.summary_meta.outputs.check_failed != 'true'
        run: |
          git config --global user.name 'DC Bills Monitor'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bill-status-history.json src/data/bills.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bill statuses - ${{ steps.check_changes.outputs.timestamp }}"
            git push
          fi

      - name: Rebuild and deploy site
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true' && steps.summary_meta.outputs.check_failed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishable client key, inlined into the HTML by Vite at build time.
          # A repo VARIABLE, not a secret — it ships to every visitor anyway, and
          # masking it in logs would only make failures harder to debug.
          # If unset, the site builds fine with tracking inert.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
        run: |
          echo "Rebuilding and deploying site..."
          npm run build

          # Configure git for gh-pages to use GITHUB_TOKEN
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          npm run deploy
          echo "✅ Deployment complete"

      - name: Send email notification
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          # A run where the lookups failed gets its own subject. It used to inherit
          # "notable changes found" — because errors feed hasMeaningfulChanges — so a
          # total API outage arrived in the inbox looking like a productive run.
          subject: >-
            ${{ steps.summary_meta.outputs.check_failed == 'true'
              && format('⚠️ DC Bills: CHECK FAILED — {0}/{1} lookups errored, data NOT verified',
                        steps.summary_meta.outputs.error_count, steps.summary_meta.outputs.total_bills)
              || (steps.summary_meta.outputs.has_meaningful_changes == 'true'
                  && format('DC Bills: notable changes found - {0}', steps.check_changes.outputs.timestamp)
                  || format('DC Bills: no notable changes - {0}', steps.check_changes.outputs.timestamp)) }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: DC Bills Monitor <noreply@representdc.org>
          html_body: file://monitoring-summary.html
          ignore_cert: false

      # Runs last, so the artifact and the summary email are still produced for debugging.
      # Without this the job went green on 2026-07-26 with 77/77 lookups failing, and the
      # only signal was the freshness watchdog 19 hours later.
      - name: Fail the run when the check was unhealthy
        if: steps.summary_meta.outputs.check_failed == 'true'
        run: |
          echo "::error::Bill check unhealthy: ${{ steps.summary_meta.outputs.error_count }}/${{ steps.summary_meta.outputs.total_bills }} lookups failed. Nothing was committed or deployed, and lastChecked was not stamped."
          exit 1
